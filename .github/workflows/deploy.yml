
name: Deploy Hexo Blog

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hexo-deployment
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取博客源码
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # 2. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # 3. 安装 Hexo 依赖
      - name: Install dependencies
        run: npm ci

      # 4. 生成静态博客
      - name: Build Hexo
        run: |
          npx hexo clean
          npx hexo generate

      # 5. 发布到 GitHub Pages 仓库
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: Ruthless338/Ruthless338.github.io
          publish_branch: main
          publish_dir: ./public
